<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Admin Market — B2B ulgurji bozor.">
  <meta name="theme-color" content="#1E4FD8">

  <!-- iOS / PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Admin Market">
  <link rel="apple-touch-icon" href="icons/Icon-apple-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Admin Market</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1E4FD8; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(135deg, #1E4FD8, #3A6BF0);
      transition: opacity .35s ease; z-index: 9999;
    }
    #boot img { width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    #boot .name { color: #fff; font: 700 22px system-ui, -apple-system, sans-serif;
      letter-spacing: .3px; }
    #boot .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    #boot.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="Admin Market"/>
    <div class="name">Admin Market</div>
    <div class="spin"></div>
  </div>

  <script>
    // Hide the boot splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot');
      if (el) { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 400); }
    });

    // Capture the PWA install prompt so Flutter can offer an "Install" button.
    window._amInstall = { prompt: null, available: false };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._amInstall.prompt = e;
      window._amInstall.available = true;
    });
    window.addEventListener('appinstalled', function () {
      window._amInstall.prompt = null;
      window._amInstall.available = false;
    });
    window._amInstallTrigger = function () {
      var p = window._amInstall.prompt;
      if (!p) return;
      p.prompt();
      window._amInstall.prompt = null;
      window._amInstall.available = false;
    };

    // ── Web Push ──
    function _urlB64ToUint8(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      var raw = atob(base64);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    window._push = {
      supported: function () {
        return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
      },
      // Request permission, register the dedicated SW, subscribe, return JSON.
      subscribe: async function (vapidKey) {
        if (!this.supported()) return null;
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') return null;
        var reg = await navigator.serviceWorker.register('/psw/push-sw.js?v=2', { scope: '/psw/' });
        if (!reg.active) {
          await new Promise(function (resolve) {
            var sw = reg.installing || reg.waiting;
            if (!sw) return resolve();
            sw.addEventListener('statechange', function () {
              if (sw.state === 'activated') resolve();
            });
          });
        }
        var existing = await reg.pushManager.getSubscription();
        var sub = existing || await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: _urlB64ToUint8(vapidKey),
        });
        return JSON.stringify(sub);
      },
    };

    // ── File picker (bulk product import) ──
    window._pickFile = function (accept) {
      return new Promise(function (resolve) {
        var settled = false;
        var input = document.createElement('input');
        input.type = 'file';
        if (accept) input.accept = accept;
        input.style.display = 'none';
        document.body.appendChild(input);
        function cleanup() { if (input.parentNode) input.parentNode.removeChild(input); }
        input.onchange = function () {
          var f = input.files && input.files[0];
          if (!f) { settled = true; cleanup(); resolve(null); return; }
          var reader = new FileReader();
          reader.onload = function () {
            settled = true; cleanup();
            var b64 = String(reader.result).split(',')[1] || '';
            resolve(JSON.stringify({ name: f.name, data: b64 }));
          };
          reader.onerror = function () { settled = true; cleanup(); resolve(null); };
          reader.readAsDataURL(f);
        };
        // Cancel fallback: window refocuses with no file chosen.
        window.addEventListener('focus', function onFocus() {
          window.removeEventListener('focus', onFocus);
          setTimeout(function () { if (!settled) { cleanup(); resolve(null); } }, 600);
        });
        input.click();
      });
    };

    // ── File download (invoices, Excel exports) ──
    window._download = function (filename, base64, mime) {
      try {
        var bin = atob(base64);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var blob = new Blob([arr], { type: mime || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
